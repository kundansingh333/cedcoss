version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: reviewlens_db
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - reviewlens_network

  # Express.js Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: reviewlens_api
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/reviewlens
      - CLIENT_URL=http://localhost:80
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - reviewlens_network

  # React 19 Frontend (Served via Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: reviewlens_web
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - reviewlens_network

networks:
  reviewlens_network:
    driver: bridge

volumes:
  mongo_data:
